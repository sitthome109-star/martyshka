[package]
name = "martyshka"
version = "1.0.0"
edition = "2021"
description = "Мартышка — личный ИИ-помощник, агент-программист, Telegram и Говорилка на Rust"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
futures-util = "0.3"
globset = "0.4"
once_cell = "1.20"
parking_lot = "0.12"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.6"
tokio = { version = "1.41", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }
walkdir = "2.5"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
tao = "0.30"
wry = "0.47"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
