<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===================== КАРКАС (не менять) =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const keys = {};                 // keys['ArrowLeft'], keys['KeyA'], keys['Space'] … — зажата ли клавиша
const pressed = {};              // pressed[...] — нажата В ЭТОМ кадре (один раз)
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (e.code === 'Space' && state !== 'play') { e.stopImmediatePropagation(); startGame(); }
  else if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  else if (e.code === 'KeyR' && state === 'over') startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
const mouse = { x: 0, y: 0, down: false, clicked: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true; mouse.clicked = true;
  if (state === 'start' || state === 'over') startGame(); });
window.addEventListener('mouseup', () => { mouse.down = false; });

let audio = null;
function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.05) {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch (e) {}
}

let state = 'start';             // 'start' | 'play' | 'pause' | 'over'
let score = 0, best = 0, overText = 'Игра окончена';
try { best = +localStorage.getItem('best___ID__') || 0; } catch (e) {}
let __busy = false;              // защита от зацикливания, если игра вызывает startGame/gameOver изнутри своих
function startGame() {
  if (__busy) return; __busy = true;
  try {
    score = 0; overText = 'Игра окончена'; initGame();
    // если мозг написал свою функцию старта (флаги вроде gameActive) — вызываем и её
    if (typeof __own_startGame === 'function') { try { __own_startGame(); } catch (e) { console.error(e); } }
    state = 'play';
  } finally { __busy = false; }
}
function gameOver(text) {         // вызывай, когда игра закончилась (проигрыш или победа)
  if (__busy || state === 'over') return; __busy = true;
  try {
    overText = text || 'Игра окончена'; state = 'over'; beep(150, 0.3, 'sawtooth');
    if (score > best) { best = score; try { localStorage.setItem('best___ID__', best); } catch (e) {} }
    if (typeof __own_gameOver === 'function') { try { __own_gameOver(text); } catch (e) { console.error(e); } }
    state = 'over';
  } finally { __busy = false; }
}
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hit(a, b) {              // столкновение прямоугольников {x, y, w, h}
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function text(t, x, y, size = 24, color = '#fff', align = 'center') {
  // защита от перепутанного порядка: text('…', x, y, '#fff', 'right')
  if (typeof size === 'string') { align = (color === '#fff' ? 'center' : color); color = size; size = 20; }
  if (['left', 'right', 'center'].includes(color)) { align = color; color = '#fff'; }
  ctx.fillStyle = color; ctx.font = `bold ${size}px Segoe UI, Arial`; ctx.textAlign = align; ctx.fillText(String(t), x, y);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);   // dt — В СЕКУНДАХ (обычно ~0.016)
  last = now;
  if (state === 'play') updateGame(dt);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (state !== 'start') drawGame();
  text('Счёт: ' + score, 16, 34, 22, '#fff', 'left');
  text('Рекорд: ' + best, 16, 62, 16, '#9aa4b2', 'left');
  if (state === 'start') {
    text(TITLE, W / 2, H / 2 - 60, 48, ACCENT);
    text(HELP, W / 2, H / 2, 20, '#cfd6df');
    text('Нажми ПРОБЕЛ или кликни, чтобы начать', W / 2, H / 2 + 50, 22, '#fff');
  } else if (state === 'pause') {
    text('Пауза — нажми P', W / 2, H / 2, 36, '#fff');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    text(overText, W / 2, H / 2 - 30, 44, ACCENT);
    text('Счёт: ' + score + '   Рекорд: ' + best, W / 2, H / 2 + 15, 24, '#fff');
    text('R или ПРОБЕЛ — заново', W / 2, H / 2 + 55, 20, '#cfd6df');
  }
  for (const k in pressed) delete pressed[k];
  mouse.clicked = false;
  requestAnimationFrame(frame);
}

// ===================== ИГРА (пишется под каждую игру) =====================
__GAME__
// ===================== ЗАПУСК =====================
initGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
