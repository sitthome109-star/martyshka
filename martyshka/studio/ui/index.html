<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мартышка</title>
<style>
:root{
  --bg:#090c12; --text:#eef2f8; --muted:#9aa5b8; --dim:#626d80; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --card:rgba(18,22,32,.62); --glass:rgba(20,24,34,.66); --acc:#1698ff; --acc2:#45caff; --acc-rgb:22,152,255; --link:#7ad4ff;
  --ok:#3ddc97; --bad:#ff6b7a;
}
[data-theme="violet"]{
  --bg:#0c0c0f; --card:rgba(28,26,38,.64); --glass:rgba(28,26,38,.68);
  --acc:#8b6cf6; --acc2:#a47ff7; --acc-rgb:139,108,246; --link:#b9a3ff;
}
[data-theme="emerald"]{
  --bg:#08100e; --card:rgba(16,28,25,.64); --glass:rgba(16,28,25,.68);
  --acc:#10b981; --acc2:#34d399; --acc-rgb:16,185,129; --link:#6ee7b7;
}
[data-theme="graphite"]{
  --bg:#0b0c0e; --card:rgba(26,28,32,.68); --glass:rgba(26,28,32,.74);
  --acc:#64748b; --acc2:#94a3b8; --acc-rgb:148,163,184; --link:#cbd5e1;
}
[data-theme="sunset"]{
  --bg:#100a08; --card:rgba(30,20,18,.64); --glass:rgba(32,21,18,.70);
  --acc:#f59e0b; --acc2:#fb7185; --acc-rgb:245,158,11; --link:#fcd34d;
}
[data-theme="sakura"]{
  --bg:#100910; --card:rgba(30,18,30,.64); --glass:rgba(32,19,32,.70);
  --acc:#ec4899; --acc2:#f472b6; --acc-rgb:236,72,153; --link:#f9a8d4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14.5px/1.62 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;transition:background .35s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
::selection{background:rgba(var(--acc-rgb),.38)}

#smoke{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.48;filter:grayscale(1) contrast(1.22) brightness(.52)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(58% 48% at 22% 14%,rgba(var(--acc-rgb),.15) 0%,transparent 62%),
             radial-gradient(52% 46% at 82% 24%,rgba(var(--acc-rgb),.10) 0%,transparent 60%),
             radial-gradient(95% 75% at 50% 48%,transparent 28%,rgba(5,7,11,.88) 100%)}

nav.top{position:relative;z-index:3;height:56px;display:flex;justify-content:center;align-items:stretch;gap:4px;border-bottom:1px solid var(--line);background:rgba(12,15,22,.56);backdrop-filter:blur(24px) saturate(1.45);box-shadow:0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.22)}
nav.top button.navb{display:flex;align-items:center;gap:7px;padding:0 13px;color:var(--muted);font-weight:600;font-size:13.8px;border-bottom:2px solid transparent;transition:.18s;position:relative}
nav.top button.navb svg{width:16px;height:16px;opacity:.85}
nav.top button.navb:hover{color:#fff;background:rgba(255,255,255,.03)}
nav.top button.navb.on{color:#fff;border-bottom-color:var(--acc2);text-shadow:0 0 18px rgba(var(--acc-rgb),.45)}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:none}
.nav-dot.on{display:inline-block}
.nav-left{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}
.kbtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--muted);font-size:12px;font-weight:600;transition:.16s}
.kbtn:hover{background:rgba(var(--acc-rgb),.18);border-color:rgba(var(--acc-rgb),.45);color:#fff}
.theme-pick{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line2);backdrop-filter:blur(12px)}
.theme-pick button{width:13px;height:13px;border-radius:50%;border:2px solid transparent;transition:.18s;padding:0}
.theme-pick button:hover{transform:scale(1.22)}
.theme-pick button.on{border-color:#fff;box-shadow:0 0 10px rgba(var(--acc-rgb),.85)}

@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mu,.ma{animation:msgIn .22s cubic-bezier(.2,.8,.2,1)}
.user-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.uchip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;background:rgba(var(--acc-rgb),.13);border:1px solid rgba(var(--acc-rgb),.32);font-size:12.5px;font-weight:600;color:#e8f3ff}
.uchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok)}
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.cmd-chip{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:11px;background:rgba(0,0,0,.26);border:1px solid var(--line);text-align:left;transition:.15s}
.cmd-chip:hover{background:rgba(var(--acc-rgb),.16);border-color:rgba(var(--acc-rgb),.45);transform:translateY(-1px)}
.cmd-chip b{font:600 12.8px Consolas,"Cascadia Code",monospace;color:var(--link)}
.cmd-chip small{font-size:11.8px;color:var(--muted)}
.pal-box{width:min(540px,92vw);background:rgba(16,19,28,.92);border:1px solid var(--line2);border-radius:18px;padding:12px;box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(26px) saturate(1.4)}
.pal-in{width:100%;height:42px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line2);padding:0 14px;outline:none;font-size:14.5px}
.pal-in:focus{border-color:rgba(var(--acc-rgb),.65)}
.pal-list{margin-top:8px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.pal-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;text-align:left;font-size:13.5px;color:#dbe2ef;transition:.12s}
.pal-item:hover,.pal-item.on{background:rgba(var(--acc-rgb),.22);color:#fff}
.pal-item small{color:var(--muted);font-size:12px}

.page{position:relative;z-index:1;height:calc(100% - 56px);display:none;flex-direction:column}
.page.on{display:flex}

.hero{flex:none;text-align:center;padding:22px 20px 8px}
.hero h1{margin:0;font-size:54px;font-weight:800;letter-spacing:-1px;line-height:1.05;
  background:linear-gradient(180deg,#fff 0%,#d7e2f0 58%,#8d9ab0 100%);-webkit-background-clip:text;color:transparent;display:inline-flex;align-items:flex-start;gap:2px}
.hero h1 .star{width:26px;height:26px;margin-top:-2px;fill:var(--acc2);filter:drop-shadow(0 0 10px rgba(var(--acc-rgb),.7))}
.hero .sub{color:var(--muted);margin:6px 0 16px;font-size:15px}
.hero .btns{display:flex;gap:10px;justify-content:center}
.hb{display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;background:var(--glass);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(16px);font-weight:650;transition:.15s}
.hb:hover{background:rgba(255,255,255,.1);border-color:rgba(var(--acc-rgb),.45)}
.hb svg{width:17px;height:17px}
.hb.live{border-color:rgba(61,220,151,.5);box-shadow:0 0 0 3px rgba(61,220,151,.12)}
.hb.live .ldot{display:inline-block}
.ldot{display:none;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hero .clock{margin-top:12px;color:var(--muted);font-size:13px}.hero .clock b{color:#fff;margin-right:6px}

.bar{flex:none;width:min(860px,calc(100% - 40px));margin:8px auto 8px;display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;background:var(--glass);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.1);border-color:rgba(var(--acc-rgb),.4)}
.bar label{color:var(--muted);font-size:13px;white-space:nowrap}
.sel{flex:1;height:36px;border-radius:10px;background:var(--glass);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px);padding:0 12px;outline:none;cursor:pointer;min-width:0}
.sel option{background:#181c26}
.accbtn{width:40px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(var(--acc-rgb),.38)}
.accbtn svg{width:17px;height:17px}

#scroll{flex:1;overflow:auto;min-height:0;position:relative}
#thread{width:min(860px,calc(100% - 40px));margin:0 auto;padding:8px 0 36px}
.empty{color:var(--muted);text-align:center;margin-top:5vh}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.sg{padding:8px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line2);backdrop-filter:blur(12px);font-size:13px;color:#d6dced;transition:.15s}
.sg:hover{background:rgba(var(--acc-rgb),.18);border-color:rgba(var(--acc-rgb),.5);color:#fff}

.mu{display:flex;justify-content:flex-end;margin:16px 0}
.mu .b{max-width:74%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:11px 16px 8px;border-radius:18px 18px 5px 18px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 8px 24px rgba(var(--acc-rgb),.26)}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;opacity:.75;margin-top:4px}
.meta svg{width:11px;height:11px}
.ma{display:flex;align-items:flex-start;gap:11px;margin:16px 0}
.orb-dot{flex:none;width:28px;height:28px;margin-top:4px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 30%,#e6f7ff 0%,var(--acc2) 32%,var(--acc) 68%,rgba(var(--acc-rgb),.18) 100%);
  box-shadow:0 0 14px rgba(var(--acc-rgb),.48), inset 0 0 6px rgba(255,255,255,.45);transition:.25s}
.ma.thinking .orb-dot{animation:orbPulse 1.5s ease-in-out infinite}
@keyframes orbPulse{
  0%,100%{transform:scale(.94);box-shadow:0 0 12px rgba(var(--acc-rgb),.5),0 0 0 0 rgba(var(--acc-rgb),.38)}
  50%{transform:scale(1.08);box-shadow:0 0 22px rgba(var(--acc-rgb),.85),0 0 0 8px rgba(var(--acc-rgb),0)}
}
.ma .b{max-width:calc(88% - 39px);min-width:120px;background:var(--card);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 28px rgba(0,0,0,.22);padding:13px 17px 9px;border-radius:18px 18px 18px 5px;backdrop-filter:blur(18px) saturate(1.25);word-wrap:break-word}
.ma .meta{color:var(--muted)}

.md p{margin:0 0 9px}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{margin:12px 0 6px;line-height:1.3}.md h1{font-size:19px}.md h2{font-size:16.5px}.md h3{font-size:15px}
.md ul,.md ol{margin:4px 0 8px;padding-left:22px}.md li{margin:2px 0}
.md code{background:rgba(0,0,0,.35);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font:13px Consolas,"Cascadia Code",monospace;color:#ffd08a}
.md a{color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.md blockquote{margin:6px 0;padding:5px 12px;border-left:3px solid var(--acc);color:#cfcfd8;background:rgba(var(--acc-rgb),.09);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;margin:8px 0;font-size:13.5px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:5px 10px;text-align:left}.md th{background:rgba(255,255,255,.05)}
.code{margin:8px 0;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:rgba(6,8,14,.55)}
.code .cb{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:rgba(255,255,255,.05);color:var(--muted);font-size:12px}
.code .cb button{color:var(--muted);font-size:12px;padding:2px 8px;border-radius:6px}.code .cb button:hover{color:#fff;background:rgba(255,255,255,.08)}
.code pre{margin:0;padding:10px 13px;overflow:auto;font:13px/1.5 Consolas,"Cascadia Code",monospace;color:#dcdce6;max-height:480px}
.typing::after{content:"";display:inline-block;width:7px;height:14px;margin-left:3px;background:var(--acc2);border-radius:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.shine{background:linear-gradient(90deg,#9a9aa6 0%,#fff 50%,#9a9aa6 100%);background-size:200% 100%;-webkit-background-clip:text;color:transparent;animation:shine 1.6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.err{margin:6px 0;padding:8px 12px;border-radius:10px;background:rgba(255,107,122,.08);border:1px solid rgba(255,107,122,.3);color:#ffb8c0;font-size:13.5px}

.steps{margin:0 0 8px;border:1px solid var(--line);border-radius:11px;background:rgba(0,0,0,.22);overflow:hidden;display:none}
.steps.show{display:block}
.sh{display:flex;align-items:center;gap:8px;padding:7px 11px;cursor:pointer;font-size:13px;color:#cfcfd8;user-select:none}
.sh .ic{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex:none}
.sh .ic svg{width:15px;height:15px}
.sh .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .n{color:var(--muted);font-size:12px;white-space:nowrap}
.sh .chev{display:flex;color:var(--dim);transition:.2s}
.steps.open .sh .chev{transform:rotate(90deg)}
.sl{display:none;border-top:1px solid var(--line);padding:6px 11px 9px;max-height:46vh;overflow:auto}
.steps.open .sl{display:block}
.st{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12.8px;color:#bfbfca}
.st .si{flex:none;width:15px;height:15px;margin-top:2px;display:flex;align-items:center;justify-content:center}
.st .si svg{width:14px;height:14px}
.st .sx{flex:1;min-width:0}
.st .sx .lb{cursor:pointer;word-break:break-word}
.st .sx .dt{display:none;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;color:#9d9daa;background:rgba(0,0,0,.3);border-radius:7px;padding:6px 8px;margin-top:4px;max-height:220px;overflow:auto}
.st.open .sx .dt:not(:empty){display:block}
.st img{display:block;max-width:100%;max-height:260px;border-radius:8px;margin-top:6px;cursor:zoom-in}
.st .fl{color:var(--link);cursor:pointer;font-size:12px;margin-top:3px}
.st.think .lb,.st.note .lb{color:var(--muted)}
.plan{margin:4px 0 6px;padding:7px 9px;border-radius:9px;background:rgba(var(--acc-rgb),.08);border:1px solid rgba(var(--acc-rgb),.24)}
.plan .pt{font-size:12px;color:var(--muted);margin-bottom:3px}
.pi{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:2px 0;color:#cfcfd8}
.pi .bx{flex:none;width:15px;height:15px;border-radius:4px;border:2px solid #4a4a58;margin-top:3px;display:flex;align-items:center;justify-content:center}
.pi.in_progress{color:#fff}.pi.in_progress .bx{border-color:var(--acc2);box-shadow:0 0 6px var(--acc2)}
.pi.done{color:var(--dim);text-decoration:line-through}.pi.done .bx{background:var(--ok);border-color:var(--ok)}
.pi.done .bx::after{content:"";width:7px;height:4px;border-left:2px solid #0c0c0f;border-bottom:2px solid #0c0c0f;transform:rotate(-45deg) translate(1px,-1px)}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--acc2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#toBottom{position:fixed;left:50%;bottom:108px;transform:translateX(-50%) translateY(14px);height:32px;padding:0 14px;border-radius:20px;background:var(--glass);border:1px solid rgba(var(--acc-rgb),.45);color:#fff;font-size:12.5px;font-weight:600;backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:6}
#toBottom.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#toBottom:hover{background:rgba(var(--acc-rgb),.28)}

.composer{flex:none;width:min(860px,calc(100% - 40px));margin:0 auto 6px}
.box{display:flex;align-items:flex-end;gap:6px;background:var(--glass);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.28);border-radius:16px;padding:8px 8px 8px 10px;backdrop-filter:blur(18px) saturate(1.25)}
.box:focus-within{border-color:rgba(var(--acc-rgb),.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 3px rgba(var(--acc-rgb),.12)}
.ib{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#bdbdc8;flex:none;transition:.15s}
.ib:hover{background:rgba(255,255,255,.08);color:#fff}
.ib svg{width:18px;height:18px}
.ib.on{color:#fff;background:rgba(var(--acc-rgb),.28)}
.ib.rec{color:#fff;background:#d6455a;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(214,69,90,.2)}}
.vol-wrap{position:relative;display:flex;align-items:center}
.vol-pop{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(6px);margin-bottom:8px;padding:9px 12px;border-radius:12px;background:rgba(16,20,28,.94);border:1px solid var(--line2);backdrop-filter:blur(16px);box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap;z-index:12}
.vol-wrap:hover .vol-pop,.vol-wrap:focus-within .vol-pop{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.vol-pop small{font-size:11.5px;color:var(--muted)}
.vol-pop input.vol{width:96px;accent-color:var(--acc);margin:0}
.box textarea{flex:1;min-width:0;background:none;border:0;outline:none;resize:none;max-height:36vh;min-height:24px;line-height:1.5;padding:7px 8px}
#send{width:46px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 16px rgba(var(--acc-rgb),.38)}
#send:disabled{opacity:.45;cursor:default;box-shadow:none}
#send.stop{background:#5a2733}
.hint{width:min(860px,calc(100% - 40px));margin:0 auto 10px;color:var(--dim);font-size:12.3px;display:flex;align-items:center;gap:6px}
.hint svg{width:13px;height:13px}

.wrap{flex:1;overflow:auto}
.inner{width:min(820px,calc(100% - 40px));margin:0 auto;padding:26px 0 60px}
.inner h2{margin:0 0 4px;font-size:24px}
.inner .pd{color:var(--muted);margin:0 0 18px}
.sec{background:var(--card);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);border-radius:16px;padding:6px 18px;margin:0 0 16px;backdrop-filter:blur(16px) saturate(1.2)}
.sec>h3{margin:12px 0 2px;font-size:15px}.sec>.sd{color:var(--muted);font-size:12.8px;margin:0 0 4px}
.field{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .lab{flex:1;min-width:0}
.field .lab b{display:block;font-weight:600;font-size:13.8px}
.field .lab small{display:block;color:var(--muted);font-size:12.3px;margin-top:2px}
.field .ctl{flex:none;width:280px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.field.wide{flex-direction:column}.field.wide .ctl{width:100%}
.in{width:100%;height:36px;border-radius:9px;background:rgba(0,0,0,.3);border:1px solid var(--line2);padding:0 11px;outline:none}
.in:focus{border-color:rgba(var(--acc-rgb),.65)}
textarea.in{height:90px;padding:9px 11px;resize:vertical}
select.in option{background:#181c26}
.tog{width:42px;height:24px;border-radius:20px;background:#34343e;position:relative;transition:.2s;flex:none;cursor:pointer}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}

kbd{font:11px Consolas;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12)}

.diff{margin-top:6px;padding:7px 9px;border-radius:8px;background:rgba(0,0,0,.42);border:1px solid var(--line);font:11.8px/1.45 Consolas,monospace;max-height:220px;overflow:auto;white-space:pre}

// ================= дымчатый фон (медленно плывущий шум) =================
(function smoke(){
  const cv=$('#smoke'), W=240, H=150; cv.width=W; cv.height=H; const ctx=cv.getContext('2d'); const img=ctx.createImageData(W,H);
  const P=new Uint8Array(512); const p=[...Array(256).keys()].sort(()=>Math.random()-.5); for(let i=0;i<512;i++)P[i]=p[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+t*(b-a);
  const grad=(h,x,y)=>((h&1)?-x:x)+((h&2)?-y:y);
  function noise(x,y){const X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=fade(x),v=fade(y);
    const a=P[X]+Y,b=P[X+1]+Y;return lerp(lerp(grad(P[a],x,y),grad(P[b],x-1,y),u),lerp(grad(P[a+1],x,y-1),grad(P[b+1],x-1,y-1),u),v);}
  let t=Math.random()*10;
  function frame(){ t+=0.004;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const nx=x/W*3, ny=y/H*2;
      const wx=noise(nx+t,ny-t*.7)*1.6, wy=noise(nx-t*.6+5,ny+t)*1.6;
      let v=noise(nx*1.6+wx,ny*1.6+wy)*.6+noise(nx*3.5+wy,ny*3.5-wx)*.3+noise(nx*7,ny*7+t)*.1;
      v=Math.max(0,Math.min(1,(v+.55)*.95)); const c=Math.pow(v,1.6)*255, i=(y*W+x)*4;
      img.data[i]=img.data[i+1]=img.data[i+2]=c; img.data[i+3]=255; }
    ctx.putImageData(img,0,0); setTimeout(()=>requestAnimationFrame(frame),90); }
  frame();
})();
function tick(){ const d=new Date(); $('#clock').innerHTML=`<b>${hhmm(d)}</b>${d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}`; }

// ================= markdown =================
function inline(s){
  s=esc(s); const codes=[];
  s=s.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return `\u0000${codes.length-1}\u0000`});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,t,u)=>`<a data-href="${u}">${t}</a>`)
     .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
     .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(_,p,u)=>`${p}<a data-href="${u}">${u}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${codes[i]}</code>`);
}
function highlightCode(src){
  // Лёгкая локальная подсветка синтаксиса (без интернета и библиотек)
  const toks=[]; const hold=(cls,txt)=>{ toks.push(`<span class="${cls}">${esc(txt)}</span>`); return `\u0001${toks.length-1}\u0001`; };
  let s=String(src||'');
  s=s.replace(/("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)/g,m=>hold('hl-str',m));
  s=s.replace(/(#[^\n]*|\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g,m=>hold('hl-com',m));
  s=esc(s);
  s=s.replace(/\b(def|class|return|import|from|as|if|elif|else|for|while|try|except|finally|with|async|await|yield|pass|break|continue|lambda|None|True|False|function|const|let|var|new|switch|case|default|export|public|private|static|void|int|string|bool|struct|fn|pub|match)\b/g,'<span class="hl-kw">$1</span>');
  s=s.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="hl-num">$1</span>');
  return s.replace(/\u0001(\d+)\u0001/g,(_,i)=>toks[i]);
}
function renderDiff(diff){
  if(!diff) return null;
  const d=document.createElement('div'); d.className='diff';
  d.innerHTML=String(diff).split('\n').map(l=>{
    if(l.startsWith('+') && !l.startsWith('+++')) return `<span class="da">${esc(l)}</span>`;
    if(l.startsWith('-') && !l.startsWith('---')) return `<span class="dd">${esc(l)}</span>`;
    if(l.startsWith('@@')) return `<span class="dh">${esc(l)}</span>`;
    return `<span>${esc(l)}\n</span>`;
  }).join('');
  return d;
}
function md(src){
  const out=[]; const L=String(src||'').replace(/\r/g,'').split('\n'); let i=0;
  while(i<L.length){
    const l=L[i]; const f=l.match(/^\s*```(\S*)/);
    if(f){ const b=[]; i++; while(i<L.length && !/^\s*```/.test(L[i])) b.push(L[i++]); i++;
      out.push(`<div class="code"><div class="cb"><span>${esc(f[1]||'код')}</span><button data-copy>Копировать</button></div><pre>${highlightCode(b.join('\n'))}</pre></div>`); continue; }
    if(/^#{1,3}\s/.test(l)){ const n=l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.replace(/^#+\s*/,''))}</h${n}>`); i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      let h=`<table><tr>${cells(l).map(c=>`<th>${c}</th>`).join('')}</tr>`; i+=2;
      while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])) h+=`<tr>${cells(L[i++]).map(c=>`<td>${c}</td>`).join('')}</tr>`;
      out.push(h+'</table>'); continue; }
    if(/^\s*([-*•]|\d+[.)])\s+/.test(l)){ const ord=/^\s*\d/.test(l); const it=[];
      while(i<L.length && /^\s*([-*•]|\d+[.)])\s+/.test(L[i])) it.push(L[i++].replace(/^\s*([-*•]|\d+[.)])\s+/,''));
      out.push(`<${ord?'ol':'ul'}>${it.map(x=>`<li>${inline(x)}</li>`).join('')}</${ord?'ol':'ul'}>`); continue; }
    if(/^>\s?/.test(l)){ const b=[]; while(i<L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/,'')); out.push(`<blockquote>${inline(b.join(' '))}</blockquote>`); continue; }
    if(!l.trim()){ i++; continue; }
    const p=[]; while(i<L.length && L[i].trim() && !/^\s*(```|#{1,3}\s|[-*•]\s|\d+[.)]\s|>|\|)/.test(L[i])) p.push(L[i++]);
    if(!p.length) p.push(L[i++]);
    out.push(`<p>${p.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

const IC={
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',

// ================= сообщения =================
const thread=$('#thread'), scroller=$('#scroll'), toBottomBtn=$('#toBottom'); let stick=true;
scroller.addEventListener('scroll',()=>{
  stick=scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<80;
  toBottomBtn.classList.toggle('show', !stick && scroller.scrollHeight-scroller.clientHeight>200);

toBottomBtn.onclick=()=>{ stick=true; scroller.scrollTo({top:scroller.scrollHeight,behavior:'smooth'}); toBottomBtn.classList.remove('show'); };
const down=()=>{ if(stick){ scroller.scrollTop=scroller.scrollHeight; toBottomBtn.classList.remove('show'); } };
const SUGS=['Что было вчера?','Что у меня на экране?','Сделай сайт-визитку и проверь его','Какие новости сегодня?','Напомни через час попить воды'];
function emptyChat(){ thread.innerHTML=`<div class="empty">Начни разговор — я сама выберу, каким мозгом думать.<div class="sugs">${SUGS.map(q=>`<button class="sg" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`; }
function addUser(t,time){ const e=thread.querySelector('.empty'); if(e) e.remove();
  const d=document.createElement('div'); d.className='mu'; d.innerHTML=`<div class="b"><div class="tx"></div><div class="meta">${time||hhmm(new Date())}</div></div>`;

// Один ход Мартышки = пузырь: сверху ОДНА свёрнутая строка «что делает» (шаги, мысли, план), ниже — ответ
function newTurn(){
  const d=document.createElement('div'); d.className='ma thinking';
  d.innerHTML=`<div class="orb-dot" aria-hidden="true"></div><div class="b"><div class="steps"><div class="sh"><span class="ic"><span class="spin"></span></span><span class="t shine">Думаю</span><span class="n"></span><span class="chev">${IC.chev}</span></div><div class="sl"><div class="plan" style="display:none"><div class="pt">План</div><div class="pl"></div></div><div class="items"></div></div></div><div class="ans"></div><div class="meta"></div></div>`;
  thread.appendChild(d);
  const T={el:d, steps:d.querySelector('.steps'), items:d.querySelector('.items'), ans:d.querySelector('.ans'), meta:d.querySelector('.meta'),
    seg:null, segText:'', think:null, thinkText:'', count:0, plan:[], tools:{}, live:true};
  T.steps.querySelector('.sh').onclick=()=>T.steps.classList.toggle('open');
  st.turn=T; return T;
}
const turn=()=>st.turn||newTurn();
function setHead(T,text,kind){ const sh=T.steps.querySelector('.sh'); T.steps.classList.add('show');
  const t=sh.querySelector('.t'); t.textContent=text; t.className='t'+(T.live?' shine':'');
  sh.querySelector('.ic').innerHTML=T.live?'<span class="spin"></span>':(kind==='bad'?IC.bad:IC.done);
  const done=T.plan.filter(x=>x.status==='done').length;
  sh.querySelector('.n').textContent=(T.plan.length?`план ${done}/${T.plan.length}`:'')+(T.plan.length&&T.count?' · ':'')+(T.count?`шагов: ${T.count}`:''); }
function stepItem(T,icon,label,detail,cls){ const s=document.createElement('div'); s.className='st'+(cls?' '+cls:'');
  s.innerHTML=`<span class="si">${icon}</span><div class="sx"><div class="lb"></div><div class="dt"></div></div>`;
  s.querySelector('.lb').textContent=label; s.querySelector('.dt').textContent=detail||'';
  s.querySelector('.lb').onclick=()=>s.classList.toggle('open'); T.items.appendChild(s); return s; }
let raf=0;
function renderSeg(){ raf=0; const T=st.turn; if(T&&T.seg){ T.seg.innerHTML=md(T.segText); down(); } }
function addText(t){ const T=turn(); closeThink(T);
  if(!T.seg){ T.seg=document.createElement('div'); T.seg.className='md typing'; T.segText=''; T.ans.appendChild(T.seg); }
  T.segText+=t; if(!raf) raf=requestAnimationFrame(renderSeg); }
// текст перед действием («сейчас посмотрю файл») уходит в свёрнутую строку, в ответе остаётся только итог
function closeSeg(T,toSteps){ if(!T||!T.seg) return; T.seg.classList.remove('typing');
  if(toSteps){ if(T.segText.trim()) stepItem(T,IC.note,T.segText.trim().slice(0,500),'','note'); T.seg.remove(); }
  else T.seg.innerHTML=md(T.segText);
  T.seg=null; }
function addThink(t){ const T=turn(); closeSeg(T,true);
  if(!T.think){ T.think=stepItem(T,IC.think,'Думает…','','think'); T.thinkText=''; T.thinkT0=Date.now(); }
  T.thinkText+=t; T.think.querySelector('.dt').textContent=T.thinkText; setHead(T,'Думаю'); }
function closeThink(T){ if(!T||!T.think) return; const s=Math.max(1,Math.round((Date.now()-T.thinkT0)/1000));
  T.think.querySelector('.lb').textContent=`Подумала · ${s} с — нажми, чтобы прочитать`; T.think=null; }
function renderPlan(T,items){ T.plan=items||[]; const box=T.steps.querySelector('.plan'); box.style.display=T.plan.length?'block':'none';
  box.querySelector('.pl').innerHTML=T.plan.map(x=>`<div class="pi ${x.status}"><span class="bx"></span><span>${esc(x.step)}</span></div>`).join('');
  T.steps.classList.add('show'); if(T.plan.length && T.live && !T.opened){ T.steps.classList.add('open'); T.opened=true; }
  const cur=T.plan.find(x=>x.status==='in_progress'); setHead(T, cur?cur.step:(T.live?'Работаю':'Готово')); }
function toolStart(e){ const T=turn(); closeThink(T); closeSeg(T,true); T.count++;
  const s=stepItem(T,'<span class="spin"></span>',e.label,'выполняется…'); T.tools[e.id]=s; setHead(T,e.label); }
function toolEnd(e){ const T=turn(); const s=T.tools[e.id]; if(!s) return;
  s.querySelector('.si').innerHTML=e.ok?IC.ok:IC.bad; s.querySelector('.dt').textContent=e.detail||'';
  if(e.diff){ const df=renderDiff(e.diff); if(df) s.querySelector('.sx').appendChild(df); }
  if(e.image){ const im=document.createElement('img'); im.src=e.image; im.onclick=()=>{$('#zoomImg').src=e.image;$('#zoom').classList.add('show')}; s.querySelector('.sx').appendChild(im); }
  if(e.file){ const a=document.createElement('div'); a.className='fl'; a.textContent='📂 '+e.file; a.onclick=()=>api().open_path(e.file); s.querySelector('.sx').appendChild(a); } }
function addError(t){ const T=turn(); closeSeg(T); const e=document.createElement('div'); e.className='err'; e.textContent=t; T.ans.appendChild(e); }
function plural(n){ return n%10===1&&n%100!==11?'шаг':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'шага':'шагов'); }
function refreshEditLast(){
  thread.querySelectorAll('.mu .macts').forEach(x=>x.remove());
  const users=thread.querySelectorAll('.mu');
  if(!users.length) return;
  const last=users[users.length-1];
  const bar=document.createElement('div'); bar.className='macts'; bar.style.justifyContent='flex-end';
  bar.innerHTML='<button title="Исправить и переотправить">✎ Исправить</button>';
  bar.querySelector('button').onclick=async()=>{
    if(st.busy) return;
    const r=await api().edit_last_user();
    if(!r||!r.ok) return;
    renderDisplay(r.display||[]);
    input.value=r.text||''; autosize(); input.focus();
  };
  last.querySelector('.b').appendChild(bar);
}
function addMsgActions(T,rawText){
  const old=T.el.querySelector('.macts'); if(old) old.remove();
  const text=(rawText||T.ans.innerText||'').trim();
  if(!text) return;
  const bar=document.createElement('div'); bar.className='macts';
  bar.innerHTML='<button data-act="copy" title="Копировать ответ">📋 Копировать</button>'+
                '<button data-act="say" title="Прочитать ответ вслух">🔊 Озвучить</button>'+
                '<button data-act="regen" title="Перегенерировать последний ответ">🔄 Заново</button>';
  bar.querySelector('[data-act="copy"]').onclick=ev=>{
    navigator.clipboard.writeText(text); ev.target.textContent='✓ Скопировано';
    setTimeout(()=>ev.target.textContent='📋 Копировать',1300);
  };
  let speakingThis=false;
  const sayBtn=bar.querySelector('[data-act="say"]');
  sayBtn.onclick=async()=>{
    if(speakingThis){ api().stop_speak(); speakingThis=false; sayBtn.textContent='🔊 Озвучить'; return; }
    speakingThis=true; sayBtn.textContent='⏹ Стоп';
    await api().speak(text);
    setTimeout(()=>{ if(speakingThis){ speakingThis=false; sayBtn.textContent='🔊 Озвучить'; } }, Math.min(90000, Math.max(4000, text.length*75)));
  };
  bar.querySelector('[data-act="regen"]').onclick=async()=>{
    if(st.busy) return;
    const r=await api().regenerate();
    if(!r||!r.ok){ toast('Нечего перегенерировать'); return; }
    renderDisplay(r.display||[]);
    send(r.text);
  };
  T.el.querySelector('.b').insertBefore(bar,T.meta);
}
function finishTurn(T,secs,time){ if(!T) return; closeThink(T); closeSeg(T); T.live=false; T.el.classList.remove('thinking');
  if(T.count||T.plan.length||T.items.children.length){ const bad=!!T.ans.querySelector('.err');
    setHead(T, bad?'Остановилась':(T.count?`Готово — ${T.count} ${plural(T.count)}`:'Подумала'), bad?'bad':'ok'); T.steps.classList.remove('open'); }
  else T.steps.remove();
  T.meta.innerHTML=(secs!=null?`${IC.clock}<span>${secs.toFixed(1)} с · </span>`:'')+(time??hhmm(new Date()));
  if(!T.ans.textContent.trim() && !T.ans.querySelector('.err')) T.ans.innerHTML='<div class="md" style="color:var(--muted)">Готово.</div>';
  addMsgActions(T, T.segText||T.ans.innerText);
  refreshEditLast();
  st.turn=null; }

function renderDisplay(items){
  thread.innerHTML=''; st.turn=null;
  if(!items.length){ emptyChat(); return; }
  let i=0;
  while(i<items.length){
    if(items[i].type==='user'){ addUser(items[i].text,''); i++; continue; }
    const T=newTurn(); T.live=false; const group=[];
    while(i<items.length && items[i].type!=='user') group.push(items[i++]);
    const lastText=[...group].reverse().find(x=>x.type==='assistant');
    for(const g of group){
      if(g.type==='assistant' && g!==lastText) stepItem(T,IC.note,g.text.slice(0,500),'','note');
      else if(g.type==='tool'){ T.count++; const s=stepItem(T,g.ok?IC.ok:IC.bad,g.label,g.detail||'');
        if(g.diff){ const df=renderDiff(g.diff); if(df) s.querySelector('.sx').appendChild(df); }
        if(g.file){ const a=document.createElement('div'); a.className='fl'; a.textContent='📂 '+g.file; a.onclick=()=>api().open_path(g.file); s.querySelector('.sx').appendChild(a);} }
      else if(g.type==='plan') renderPlan(T,g.items);
      else if(g.type==='error'){ const e=document.createElement('div'); e.className='err'; e.textContent=g.text; T.ans.appendChild(e); }
    }
    if(lastText){ const m=document.createElement('div'); m.className='md'; m.innerHTML=md(lastText.text); T.ans.prepend(m); T.segText=lastText.text; }
    finishTurn(T,null,'');
  }
  refreshEditLast();
  stick=true; down();
}

// ================= события =================
window.onEvents=evs=>{ for(const e of evs) onEvent(e); down(); };
function onEvent(e){ const T=st.turn;
  switch(e.type){
    case 'status': if(T) T.steps.querySelector('.n').title=e.brain; break;
    case 'assistant_start': turn(); break;
    case 'activity': if(T && e.kind!=='think') setHead(T,e.text); break;
    case 'text': addText(e.text); break;
    case 'progress': addThink(e.text); break;
    case 'switch': stepItem(turn(),IC.gear,e.text,'','note'); setHead(turn(),e.text); break;
    case 'tool_start': toolStart(e); break;
    case 'tool_end': toolEnd(e); break;
    case 'plan': renderPlan(turn(),e.items); break;
    case 'confirm': openConfirm(e); break;
    case 'error': addError(e.text); break;
    case 'rollback_ready': {
      const T2=turn(); const bar=document.createElement('div'); bar.className='rb-bar';
      const files=(e.files||[]).join(', ');
      bar.innerHTML=`<button class="rb-btn" title="${esc(files)}">↩ Откатить правки (${e.count})</button><small style="color:var(--dim)">${esc(files)}</small>`;
      const btn=bar.querySelector('button');
      btn.onclick=async()=>{
        if(!confirm('Откатить все правки файлов из этой задачи ('+files+')?')) return;
        btn.disabled=true; const r=await api().rollback_task(e.id);
        toast((r&&r.message)||'Готово'); if(r&&r.ok) btn.textContent='✓ Откачено'; else btn.disabled=false;
      };
      T2.ans.appendChild(bar); break;
    }
    case 'done': { const T2=st.turn; const elapsed=(Date.now()-st.t0)/1000; const text=T2?(T2.seg?T2.segText:T2.ans.innerText):''; finishTurn(T2,elapsed); setBusy(false); refreshChats(); refreshProjects(); refreshBalance();
      if(elapsed>=15 && !document.hasFocus()) api().notify_done();
      if(st.speak && text.trim()) api().speak(text); break; }
    case 'show_tab': show(e.tab==='settings'?'system':(e.tab==='chat'?'home':e.tab)); break;
    case 'voice_state': setVoice(e.on); break;
  }
}

  else if(f.type==='info'){ c.innerHTML=`<span class="pill">${esc(f.value)}</span>`; }
  else if(f.type==='button'){ const b=document.createElement('button'); b.className='btn'+(f.danger?' red':''); b.textContent=f.text;

}

async function voicePicker(c,f){

  const wrap=document.createElement('div'); wrap.innerHTML=`<div class="vfilter"></div><div style="display:flex;gap:8px;margin:0 0 10px"><input class="in" placeholder="Найти голос по названию…"><button class="btn">Искать во всей библиотеке</button></div><div class="vlist"><div style="color:var(--muted)">Загружаю голоса…</div></div>`;
  c.appendChild(wrap);

  const F=[['all','Все'],['drama','🎭 Для Drama 3'],['anime','🌸 Аниме'],['off','⭐ Официальные'],['ru','Русские'],['uk','Украинские'],['de','Немецкие'],['en','Английские'],['female','Женские'],['male','Мужские']];
  const fb=wrap.querySelector('.vfilter');
  F.forEach(([k,n])=>{ const b=document.createElement('button'); b.textContent=n; b.className=k===flt?'on':''; b.onclick=()=>{ flt=k; fb.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); draw(); }; fb.appendChild(b); });
  const inp=wrap.querySelector('input'); inp.oninput=()=>{ q=inp.value.trim().toLowerCase(); draw(); };
  wrap.querySelector('.btn').onclick=async()=>{ if(!q){ toast('Напиши название'); return; } toast('Ищу во всей библиотеке Fish…'); const r=await api().search_voices(q); const ids=new Set(all.map(v=>v.id)); r.forEach(v=>{ if(!ids.has(v.id)) all.push(v); }); draw(); };
  const L={ru:'RU',uk:'UK',de:'DE',en:'EN',ja:'JA'};
  function draw(){ const list=wrap.querySelector('.vlist'); list.innerHTML='';
    const vs=all.filter(v=>(flt==='all'||(flt==='drama'&&v.drama)||(flt==='anime'&&v.anime)||(flt==='off'&&v.official)||v.lang===flt||v.gender===flt) && (!q||v.title.toLowerCase().includes(q)||(v.desc||'').toLowerCase().includes(q))).slice(0,300);
    if(!vs.length){ list.innerHTML='<div style="color:var(--muted)">Ничего не нашла.</div>'; return; }
    vs.forEach(v=>{ const r=document.createElement('div'); r.className='v'+(v.id===cur?' sel':'');
      r.innerHTML=`<button class="play" title="Послушать">${IC.play}</button><div class="vn"><b></b><small></small></div><span class="pill">${L[v.lang]||v.lang||'?'}</span>${v.anime?'<span class="pill">🌸 аниме</span>':''}${v.drama&&!v.anime?'<span class="pill">🎭 Drama</span>':''}${v.official?'<span class="pill ok">официальный</span>':''}<button class="btn" style="height:30px">${v.id===cur?'Выбран ✓':'Выбрать'}</button>`;
      r.querySelector('b').textContent=v.title; r.querySelector('small').textContent=(v.gender==='female'?'женский · ':v.gender==='male'?'мужской · ':'')+(v.popular?Math.round(v.popular/1000)+'k использований · ':'')+(v.desc||'');
      r.querySelector('.play').onclick=async ev=>{ const p=ev.currentTarget; p.classList.add('busy'); const res=await api().preview_voice(v.id,v.lang); p.classList.remove('busy'); if(res&&res.error) toast(res.error); };
      r.querySelector('.btn').onclick=()=>{ cur=v.id; if(f.instant){ api().save_settings({[f.key]:v.id}); toast('Голос: '+v.title); } else { mark(f.key,v.id); toast('Нажми «Сохранить» внизу'); } draw(); };
      list.appendChild(r); }); }
  draw();
}

function closePal(){ $('#palette').classList.remove('show'); }
$('#bPalette').onclick=openPal;
$('#palette').onclick=ev=>{ if(ev.target===$('#palette')) closePal(); };
$('#palIn').oninput=()=>{ palIdx=0; renderPal(); };
$('#palIn').onkeydown=ev=>{
  if(ev.key==='Escape'){ closePal(); return; }
  if(ev.key==='ArrowDown'){ ev.preventDefault(); palIdx=(palIdx+1)%Math.max(1,palFiltered.length); renderPal(); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); palIdx=(palIdx-1+Math.max(1,palFiltered.length))%Math.max(1,palFiltered.length); renderPal(); }
  else if(ev.key==='Enter' && palFiltered[palIdx]){ ev.preventDefault(); const x=palFiltered[palIdx]; closePal(); x.run(); }
};
window.addEventListener('keydown',ev=>{ if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ ev.preventDefault(); $('#palette').classList.contains('show')?closePal():openPal(); } });
$('#bExport').onclick=async()=>{ const r=await api().export_chat(); toast(r.message||'Экспорт готов'); if(r.ok&&r.path) api().open_path(r.path); };

window.addEventListener('pywebviewready', async()=>{
  const r=await api().init();
  applyTheme(r.theme||'cyan');
  $('#model').value=['auto','flash','pro'].includes(r.brain_mode)?r.brain_mode:'auto';
  st.speak=!!r.chat_speak; $('#bSpeak').classList.toggle('on',st.speak); $('#vol').value=r.volume||1;
  setVoice(r.voice); $('#govNavDot')?.classList.toggle('on',!!r.gov);
  emptyChat(); refreshChats(); refreshProjects(); refreshBalance(); autosize();
  setInterval(async()=>{ try{ const d=await api().status_dots(); setVoice(d.voice); $('#govNavDot')?.classList.toggle('on',!!d.gov); }catch(e){} },4000);
  if(!r.ready) show('brain'); else if(r.tab && r.tab!=='chat') show(r.tab==='settings'?'system':r.tab);
  input.focus();
});
</script>
</body>
</html>
