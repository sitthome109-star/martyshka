<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мартышка</title>
<style>
:root{
  --bg:#07080c; --bg2:#0b0d13; --panel:#10131b; --panel2:#151925; --line:#1f2431; --line2:#2a3142;
  --text:#e9edf6; --muted:#8a93a8; --dim:#5d6578; --acc:#3d9bff; --acc2:#7a5cff; --ok:#3ddc97; --bad:#ff5d6c; --warn:#ffc14f;
  --orb:#2a9cff; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14.5px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(40% 35% at 18% 8%,rgba(61,155,255,.10),transparent 70%),radial-gradient(35% 30% at 85% 90%,rgba(122,92,255,.09),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#232838;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::selection{background:rgba(61,155,255,.35)}

/* ---------- верхняя панель ---------- */
.top{position:relative;z-index:5;height:58px;display:flex;align-items:center;gap:14px;padding:0 16px 0 12px;
  border-bottom:1px solid var(--line);background:rgba(9,11,16,.82);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.brand canvas{width:40px;height:40px}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.ttl{flex:1;text-align:center;font-weight:600;color:#cfd6e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;transition:.15s}
.seg button.on{background:linear-gradient(135deg,#1f3a66,#2d2a63);color:#fff;box-shadow:0 2px 10px rgba(61,155,255,.25)}
.seg button:hover:not(.on){color:#fff}
.tbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;color:#c8d0e0;font-size:13.5px;transition:.15s;border:1px solid transparent}
.tbtn:hover{background:var(--panel2);border-color:var(--line)}
.tbtn svg{width:17px;height:17px}
.tbtn.on{background:rgba(61,155,255,.12);border-color:rgba(61,155,255,.35);color:#fff}
.tbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.tbtn .dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ---------- раскладка ---------- */
.app{position:relative;z-index:1;display:flex;height:calc(100% - 58px)}
.side{width:268px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(9,11,16,.55)}
.side .new{margin:14px 12px 8px;height:40px;border-radius:11px;background:linear-gradient(135deg,#2f6bff,#6a4dff);color:#fff;font-weight:650;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 20px rgba(60,90,255,.28);transition:.15s}
.side .new:hover{filter:brightness(1.12);transform:translateY(-1px)}
.side .search{margin:4px 12px 8px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:0 12px;outline:none}
.side .search:focus{border-color:var(--line2)}
.chats{flex:1;overflow:auto;padding:4px 8px 10px}
.grp{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;margin:12px 8px 6px}
.chat{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;color:#c5ccdb;cursor:pointer;font-size:13.5px}
.chat span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat:hover{background:var(--panel)}
.chat.on{background:var(--panel2);color:#fff}
.chat .del{opacity:0;width:22px;height:22px;border-radius:6px;color:var(--muted)}
.chat:hover .del{opacity:1}.chat .del:hover{background:#2a1820;color:var(--bad)}
.side .foot{border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:3px}
.side .foot b{color:#cfd6e6;font-weight:600}

.main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#scroll{flex:1;overflow:auto;scroll-behavior:auto}
#thread{max-width:860px;margin:0 auto;padding:28px 28px 160px}

/* пустой чат */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:7vh}
.hero canvas{width:220px;height:220px}
.hero h1{margin:6px 0 4px;font-size:28px;font-weight:700;letter-spacing:.2px}
.hero p{color:var(--muted);margin:0 0 22px}
.sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
.sg{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;color:#cdd4e3;transition:.15s;font-size:13.5px}
.sg:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.sg b{display:block;color:#fff;font-size:13.5px;margin-bottom:2px}

/* сообщения */
.msg-user{display:flex;justify-content:flex-end;margin:22px 0 10px}
.msg-user div{max-width:78%;background:linear-gradient(135deg,#1d2b4a,#251f47);border:1px solid #2c3a5e;padding:11px 15px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-wrap:break-word}
.turn{display:flex;gap:12px;margin:12px 0}
.turn>.av{flex:none;width:30px;height:30px;margin-top:2px}
.turn>.col{flex:1;min-width:0}
.md{word-wrap:break-word}
.md p{margin:0 0 10px}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{margin:16px 0 8px;line-height:1.3}.md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:15px}
.md ul,.md ol{margin:6px 0 10px;padding-left:22px}.md li{margin:3px 0}
.md code{background:#171b27;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font:13px Consolas,"Cascadia Code",monospace;color:#ffcf85}
.md a{color:#6fb6ff;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.md blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid var(--acc2);color:#c0c7d6;background:rgba(122,92,255,.06);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;margin:10px 0;font-size:13.5px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:6px 10px;text-align:left}.md th{background:var(--panel2)}
.code{margin:10px 0;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:#0b0e15}
.code .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#121621;color:var(--muted);font-size:12px}
.code .bar button{color:var(--muted);font-size:12px;padding:2px 8px;border-radius:6px}.code .bar button:hover{background:#1c2230;color:#fff}
.code pre{margin:0;padding:12px 14px;overflow:auto;font:13px/1.5 Consolas,"Cascadia Code",monospace;color:#d6deeb;max-height:520px}
.typing::after{content:"";display:inline-block;width:8px;height:15px;margin-left:3px;background:var(--acc);border-radius:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.think{margin:4px 0 10px;border-left:2px solid var(--line2);padding-left:12px}
.think .th{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-size:13px;user-select:none}
.think .chev{transition:.2s;display:flex}.think.open .chev{transform:rotate(90deg)}
.think .tb{display:none;white-space:pre-wrap;color:#8f98ad;font-size:12.8px;max-height:260px;overflow:auto;margin-top:6px}
.think.open .tb{display:block}
.shine{background:linear-gradient(90deg,#8a93a8 0%,#fff 50%,#8a93a8 100%);background-size:200% 100%;-webkit-background-clip:text;color:transparent;animation:shine 1.6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}

.tool{margin:8px 0;border:1px solid var(--line);border-radius:11px;background:rgba(16,19,27,.7);overflow:hidden}
.tool .head{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;font-size:13.2px;color:#c9d1e2}
.tool .head span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .ic{width:16px;height:16px;color:var(--acc);display:flex}.tool .ic svg{width:16px;height:16px}
.tool .chev{color:var(--dim);display:flex;transition:.2s}.tool.open .chev{transform:rotate(90deg)}
.tool .body{display:none;white-space:pre-wrap;font:12.5px/1.5 Consolas,monospace;color:#9aa4b8;padding:8px 12px 12px;border-top:1px solid var(--line);max-height:300px;overflow:auto}
.tool.open .body{display:block}
.tool.fail{border-color:#3a2028}.tool.fail .ic{color:var(--bad)}
.tool img{display:block;max-width:100%;max-height:340px;margin:0 12px 12px;border-radius:9px;cursor:zoom-in;border:1px solid var(--line)}
.tool .file{margin:0 12px 10px;color:#7fb4ff;font-size:12.5px;cursor:pointer}
.spin{width:14px;height:14px;border:2px solid #2a3350;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{margin:8px 0;padding:9px 13px;border-radius:10px;background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.3);color:#ffb3bb;font-size:13.5px}
.switch{margin:8px 0;font-size:12.5px;color:#b9a6ff}
.live{display:none;align-items:center;gap:8px;margin:6px 0;color:var(--muted);font-size:13px}
.live.show{display:flex}.live .lic{width:15px;height:15px;color:var(--acc);display:flex}.live .lic svg{width:15px;height:15px}

/* план */
#plan{position:absolute;right:22px;top:18px;width:290px;background:rgba(16,19,27,.92);border:1px solid var(--line2);border-radius:13px;
  backdrop-filter:blur(14px);display:none;z-index:3;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#plan.show{display:block}
#planHead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
#planHead small{color:var(--muted);font-weight:500}
#planBarW{height:3px;background:var(--line);margin:0 14px}#planBar{height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:.4s}
#planList{list-style:none;margin:0;padding:8px 14px 12px;max-height:46vh;overflow:auto}
#planList li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#aeb6c8;margin:6px 0}
#planList .b{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #3a4258;margin-top:3px}
#planList li.in_progress{color:#fff}#planList li.in_progress .b{border-color:var(--acc);box-shadow:0 0 8px var(--acc)}
#planList li.done{color:var(--dim);text-decoration:line-through}#planList li.done .b{background:var(--ok);border-color:var(--ok)}
#plan.min #planList,#plan.min #planBarW{display:none}

/* ввод */
.composer{position:absolute;left:0;right:0;bottom:0;padding:0 28px 20px;background:linear-gradient(transparent,var(--bg) 38%)}
.box{max-width:860px;margin:0 auto;background:rgba(18,21,31,.92);border:1px solid var(--line2);border-radius:18px;padding:10px 10px 10px 16px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);backdrop-filter:blur(16px);transition:border-color .2s}
.box:focus-within{border-color:#3b4a70;box-shadow:0 10px 40px rgba(0,0,0,.4),0 0 0 3px rgba(61,155,255,.12)}
.box textarea{width:100%;background:none;border:0;outline:none;resize:none;max-height:40vh;min-height:24px;line-height:1.5;padding:4px 0}
.box .row{display:flex;align-items:center;gap:8px;margin-top:6px}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:12.5px;transition:.15s}
.chip:hover{color:#fff;border-color:var(--line2)}
.chip.on{color:#fff;background:rgba(255,193,79,.1);border-color:rgba(255,193,79,.4)}
.chip svg{width:14px;height:14px}
.box .sp{flex:1}
.box .hint{color:var(--dim);font-size:12px}
#send{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2f6bff,#6a4dff);display:flex;align-items:center;justify-content:center;transition:.15s}
#send:disabled{opacity:.35;cursor:default}
#send.stop{background:#3a2430}

/* выезжающая панель */
.scrim{position:fixed;inset:58px 0 0 0;background:rgba(3,4,8,.5);opacity:0;pointer-events:none;transition:.2s;z-index:8}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:58px;right:0;bottom:0;width:min(640px,94vw);background:#0c0e15;border-left:1px solid var(--line2);z-index:9;
  transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0;font-size:18px;flex:1}
.drawer .dh button{width:32px;height:32px;border-radius:9px;color:var(--muted)}.drawer .dh button:hover{background:var(--panel2);color:#fff}
.drawer .tabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.drawer .tabs button{padding:8px 12px;border-radius:9px 9px 0 0;color:var(--muted);font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent}
.drawer .tabs button.on{color:#fff;border-bottom-color:var(--acc)}
.drawer .db{flex:1;overflow:auto;padding:18px 20px 40px}
.sec{margin:0 0 22px}
.sec h3{margin:0 0 4px;font-size:15px}
.sec .sub{color:var(--muted);font-size:12.8px;margin:0 0 12px}
.field{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #151a25}
.field:last-child{border-bottom:0}
.field .lab{flex:1;min-width:0}
.field .lab b{display:block;font-weight:600;font-size:13.8px}
.field .lab small{display:block;color:var(--muted);font-size:12.3px;margin-top:2px}
.field .ctl{flex:none;width:260px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.field.wide{flex-direction:column}.field.wide .ctl{width:100%}
.in{width:100%;height:36px;border-radius:9px;background:var(--panel);border:1px solid var(--line);padding:0 11px;outline:none}
.in:focus{border-color:#3b4a70}
textarea.in{height:90px;padding:9px 11px;resize:vertical}
select.in{cursor:pointer}
.tog{width:42px;height:24px;border-radius:20px;background:#262c3c;position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:linear-gradient(135deg,#2f6bff,#6a4dff)}.tog.on::after{left:21px}
input[type=range]{width:100%;accent-color:#5a7dff}
.rv{width:46px;text-align:right;color:var(--muted);font-size:12.5px}
.btn{height:36px;padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;font-size:13.2px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#3b4a70}
.btn.pri{background:linear-gradient(135deg,#2f6bff,#6a4dff);border-color:transparent;color:#fff}
.btn.red{color:#ffb3bb;border-color:#43242c}
.btn:disabled{opacity:.4;cursor:default}
.savebar{position:sticky;bottom:-40px;margin:10px -20px -40px;padding:12px 20px;background:rgba(12,14,21,.96);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.savebar .msg{color:var(--ok);font-size:13px;opacity:0;transition:.3s}.savebar .msg.show{opacity:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin:0 0 12px}
.card h4{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;background:#1a2030;color:#aeb8cc;border:1px solid var(--line2)}
.pill.ok{color:var(--ok);border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.07)}
.pill.bad{color:#ff9aa5;border-color:rgba(255,93,108,.3);background:rgba(255,93,108,.07)}
.anger{display:flex;gap:3px;margin-left:auto}.anger i{width:14px;height:6px;border-radius:3px;background:#232a3a}
.anger i.f{background:linear-gradient(90deg,#ff9b4a,#ff4d5e)}
.facts{margin:8px 0 0;padding:0;list-style:none}
.facts li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;color:#c7cee0;font-size:13.2px;border-top:1px dashed #1c2230}
.facts li span{flex:1}.facts li button{color:var(--dim);width:20px}.facts li button:hover{color:var(--bad)}
.log{white-space:pre-wrap;font:12.5px/1.5 Consolas,monospace;color:#9fa9bd;background:#0a0c12;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:300px;overflow:auto}
.note{padding:10px 13px;border-radius:10px;background:rgba(255,193,79,.07);border:1px solid rgba(255,193,79,.25);color:#ffdca0;font-size:13px;margin:0 0 14px}

/* выбор голоса */
.vfilter{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.vfilter button{padding:5px 11px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-size:12.5px}
.vfilter button.on{color:#fff;border-color:#3b4a70;background:#172038}
.vlist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;padding-right:4px}
.v{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--panel);border:1px solid var(--line);transition:.12s}
.v:hover{border-color:var(--line2)}
.v.sel{border-color:#4a6bff;background:#141b33}
.v .play{width:32px;height:32px;border-radius:50%;background:#1b2234;display:flex;align-items:center;justify-content:center;flex:none}
.v .play:hover{background:#26304a}.v .play.busy{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(61,155,255,.15)}}
.v .vn{flex:1;min-width:0}.v .vn b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v .vn small{display:block;color:var(--muted);font-size:11.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* разрешение */
.modal{position:fixed;inset:0;background:rgba(3,4,8,.62);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.perm{width:min(560px,92vw);background:#0f121a;border:1px solid var(--line2);border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.perm .top2{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.perm .shield{width:42px;height:42px;border-radius:12px;background:rgba(255,193,79,.1);display:flex;align-items:center;justify-content:center}
.perm h3{margin:0;font-size:16px}.perm .tool-name{color:var(--muted);font-size:12.5px}
.perm .why{color:#c9d1e2;font-size:13.5px;margin:0 0 10px}
.perm pre{white-space:pre-wrap;background:#0a0c12;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12.8px/1.5 Consolas,monospace;max-height:240px;overflow:auto;margin:0 0 14px}
.perm .acts{display:flex;flex-direction:column;gap:7px}
.perm .acts button{height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.perm .acts .pri{background:linear-gradient(135deg,#2f6bff,#6a4dff);border:0}
.perm .acts .no{color:#ffb3bb}
kbd{font:11px Consolas;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:30;cursor:zoom-out}
.zoom.show{display:flex}.zoom img{max-width:92vw;max-height:92vh;border-radius:12px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#1a2134;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){.side{display:none}.brand{min-width:0}.brand small{display:none}.tbtn .tl{display:none}}
</style>
</head>
<body>
<header class="top">

<script>
const $ = s => document.querySelector(s);
const api = () => window.pywebview.api;
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const st = {chatId:null, busy:false, agent:false, turn:null, seg:null, segText:'', think:null, thinkText:'', thinkT0:0, live:null, plan:[], chats:[], orbState:'idle'};
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),2600); }

// ================= ШАР — такой же, как у голосовой Мартышки (точки на закрученных параллелях) =================
const ORB_COLORS={'голубой':'#2a9cff','синий':'#2f6bff','оранжевый':'#ff9a2e','зелёный':'#3dff8b','фиолетовый':'#b46bff','красный':'#ff4545','розовый':'#ff5fc8','белый':'#e6f2ff'};
const ORB_STATES={idle:{amp:.024,bright:.75,speed:.5,veins:1.1,spin:.22},think:{amp:.032,bright:1,speed:1.7,veins:1.9,spin:.5},speak:{amp:.048,bright:1,speed:1.45,veins:1.9,spin:.4}};
function rng(seed){ return ()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }; }
class Orb{
  constructor(cv,density){ this.cv=cv; this.ctx=cv.getContext('2d'); this.t=0; this.rot=0; this.cur={...ORB_STATES.idle}; this.color=[42,156,255];
    const r=rng(11), rings=Math.round(70*density), per=Math.round(84*density); this.P=[];
    for(let i=0;i<rings;i++){ for(let j=0;j<per;j++){ let lat=(-Math.PI/2*.985)+(Math.PI*.985)*i/(rings-1)+(r()-.5)*.6*Math.PI/rings;
      const lon=2*Math.PI*j/per+lat*3; this.P.push([Math.cos(lat)*Math.cos(lon),Math.sin(lat),Math.cos(lat)*Math.sin(lon),Math.cos(lat),1]); } }
    const nin=Math.round(this.P.length*.3);
    for(let i=0;i<nin;i++){ const phi=Math.acos(1-2*(i+.5)/nin), th=Math.PI*(1+Math.sqrt(5))*(i+.5), rr=.9*Math.cbrt(r());
      this.P.push([Math.cos(th)*Math.sin(phi)*rr,Math.cos(phi)*rr,Math.sin(th)*Math.sin(phi)*rr,.35,0]); }
    const R=rng(7); this.F=[]; for(let k=0;k<10;k++){ let d=[R()-.5,R()-.5,R()-.5]; const n=Math.hypot(...d); const m=5+R()*6; this.F.push([d[0]/n*m,d[1]/n*m,d[2]/n*m,R()*6.28,.5+R()*.9]); }
    this.B=[]; for(let k=0;k<4;k++){ let d=[R()-.5,R()-.5,R()-.5]; const n=Math.hypot(...d); const m=1.5+R()*1.5; this.B.push([d[0]/n*m,d[1]/n*m,d[2]/n*m,R()*6.28]); }
    this.glow=document.createElement('canvas'); }
  setColor(c){ c=ORB_COLORS[c]||c||'#2a9cff'; const h=c.replace('#',''); let rgb=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const g=(rgb[0]+rgb[1]+rgb[2])/3; this.color=rgb.map(v=>Math.max(0,Math.min(255,g+(v-g)*1.6))); }
  frame(dt,state,level){
    const tg=ORB_STATES[state]||ORB_STATES.idle, k=Math.min(1,dt*3); for(const key in this.cur) this.cur[key]+=(tg[key]-this.cur[key])*k;
    this.t+=dt*this.cur.speed; this.rot+=dt*(this.cur.spin+level*.9);
    const W=this.cv.width, H=this.cv.height, ctx=this.ctx, cx=W/2, cy=H/2, rad=W*.34, amp=this.cur.amp+level*.09;
    ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,W,H);
    const c=Math.cos(this.rot), s=Math.sin(this.rot), [cr,cg,cb]=this.color, ps=Math.max(1,W/110);
    ctx.globalCompositeOperation='lighter';
    for(const p of this.P){
      let fine=0; for(const f of this.F) fine+=Math.sin(p[0]*f[0]+p[1]*f[1]+p[2]*f[2]+f[3]+this.t*f[4]); fine/=3.16;
      let big=0; for(const b of this.B) big+=Math.sin(p[0]*b[0]+p[1]*b[1]+p[2]*b[2]+b[3]+this.t*.3); big/=2;
      const rr=1+amp*Math.tanh(1.2*(fine+.6*big)); let x=p[0]*rr, y=p[1]*rr, z=p[2]*rr; const xr=x*c+z*s, zr=-x*s+z*c;
      let w=p[3]*(.85+1.3*this.cur.veins*Math.exp(-((fine*5)**2))*p[4])*(zr>0?1:.45)*this.cur.bright*(.9+level*.5);
      const a=Math.min(.95,w*.42);
      ctx.fillStyle=`rgba(${cr|0},${cg|0},${cb|0},${a})`; ctx.fillRect(cx+xr*rad,cy+y*rad,ps,ps);
    }
    // свечение
    const g=this.glow; if(g.width!==W){ g.width=W; g.height=H; } const gc=g.getContext('2d'); gc.clearRect(0,0,W,H);
    gc.filter=`blur(${Math.max(2,W/28)}px)`; gc.drawImage(this.cv,0,0); gc.filter='none';
    ctx.globalAlpha=.9; ctx.drawImage(g,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
}
const orbs=[]; let orbColor='#2a9cff';
function addOrb(cv,density){ const o=new Orb(cv,density); o.setColor(orbColor); orbs.push(o); return o; }
let lastT=performance.now();
function orbLoop(now){ const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  for(let i=orbs.length-1;i>=0;i--){ const o=orbs[i]; if(!o.cv.isConnected){ orbs.splice(i,1); continue; }
    const state=o.fixed||st.orbState; o.frame(dt,state, state==='speak'?.35+.25*Math.sin(now/90):0); }
  requestAnimationFrame(orbLoop); }
addOrb($('#topOrb'),.6); requestAnimationFrame(orbLoop);

// ================= markdown =================
function inline(s){
  s=esc(s); const codes=[];
  s=s.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return `\u0000${codes.length-1}\u0000`});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,t,u)=>`<a data-href="${u}">${t}</a>`)
     .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
     .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(_,p,u)=>`${p}<a data-href="${u}">${u}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${codes[i]}</code>`);
}
function md(src){
  const out=[]; const L=String(src||'').replace(/\r/g,'').split('\n'); let i=0;
  while(i<L.length){
    const l=L[i]; const f=l.match(/^\s*```(\S*)/);
    if(f){ const b=[]; i++; while(i<L.length && !/^\s*```/.test(L[i])) b.push(L[i++]); i++;
      out.push(`<div class="code"><div class="bar"><span>${esc(f[1]||'код')}</span><button data-copy>Копировать</button></div><pre>${esc(b.join('\n'))}</pre></div>`); continue; }
    if(/^#{1,3}\s/.test(l)){ const n=l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.replace(/^#+\s*/,''))}</h${n}>`); i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      let h=`<table><tr>${cells(l).map(c=>`<th>${c}</th>`).join('')}</tr>`; i+=2;
      while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])) h+=`<tr>${cells(L[i++]).map(c=>`<td>${c}</td>`).join('')}</tr>`;
      out.push(h+'</table>'); continue; }
    if(/^\s*([-*•]|\d+[.)])\s+/.test(l)){ const ord=/^\s*\d/.test(l); const it=[];
      while(i<L.length && /^\s*([-*•]|\d+[.)])\s+/.test(L[i])) it.push(L[i++].replace(/^\s*([-*•]|\d+[.)])\s+/,''));
      out.push(`<${ord?'ol':'ul'}>${it.map(x=>`<li>${inline(x)}</li>`).join('')}</${ord?'ol':'ul'}>`); continue; }
    if(/^>\s?/.test(l)){ const b=[]; while(i<L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/,'')); out.push(`<blockquote>${inline(b.join(' '))}</blockquote>`); continue; }
    if(!l.trim()){ i++; continue; }
    const p=[]; while(i<L.length && L[i].trim() && !/^\s*(```|#{1,3}\s|[-*•]\s|\d+[.)]\s|>|\|)/.test(L[i])) p.push(L[i++]);
    if(!p.length) p.push(L[i++]);
    out.push(`<p>${p.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

// ================= иконки =================
const IC={
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="#ff5d6c" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop:'<svg width="15" height="15" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="#fff"/></svg>',
  play:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#cfe0ff"><path d="M7 4l13 8-13 8z"/></svg>',
  think:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-6 6c0 2 1 3.5 2 4.5V17h8v-3.5c1-1 2-2.5 2-4.5a6 6 0 0 0-6-6zM9 21h6"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  read:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>',
  write:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  exec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>',
  look:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  draw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  memory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>'};

// ================= чат: отрисовка =================
const thread=$('#thread'), scroller=$('#scroll'); let stick=true;
scroller.addEventListener('scroll',()=>{stick=scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<90});
const down=()=>{ if(stick) scroller.scrollTop=scroller.scrollHeight };
const SUGS=[['Что было вчера?','Вспомни, о чём мы говорили вчера и что было в Говорилке'],['Сделай сайт','Сделай красивый сайт-визитку для меня и открой его'],
  ['Что на экране?','Посмотри на мой экран и скажи, что там открыто'],['Напиши игру','Напиши небольшую игру на HTML и проверь, что она работает'],
  ['Новости','Какие главные новости сегодня?'],['Погода','Какая погода сегодня и завтра?']];
function emptyChat(){
  thread.innerHTML=`<div class="hero"><canvas width="440" height="440"></canvas><h1>Чем займёмся?</h1><p>Болтать, искать, писать код, управлять ПК — я сама выберу, каким мозгом думать.</p>
    <div class="sugs">${SUGS.map(([t,q])=>`<button class="sg" data-q="${esc(q)}"><b>${esc(t)}</b>${esc(q)}</button>`).join('')}</div></div>`;
  addOrb(thread.querySelector('canvas'),1.5);
}
function addUser(t){ if(thread.querySelector('.hero')) thread.innerHTML='';
  const d=document.createElement('div'); d.className='msg-user'; const b=document.createElement('div'); b.textContent=t; d.appendChild(b); thread.appendChild(d); }
function newTurn(){ const t=document.createElement('div'); t.className='turn'; t.innerHTML='<canvas class="av" width="72" height="72"></canvas><div class="col"></div>';
  thread.appendChild(t); const o=addOrb(t.querySelector('canvas'),.45); o.fixed=null;
  st.turn=t.querySelector('.col'); st.seg=null; st.think=null;
  st.live=document.createElement('div'); st.live.className='live'; st.live.innerHTML='<div class="lic"></div><span class="shine"></span>'; st.turn.appendChild(st.live); return st.turn; }
const turnEl=()=>st.turn||newTurn();
function place(el){ const t=turnEl(); if(st.live && st.live.parentNode===t) t.insertBefore(el,st.live); else t.appendChild(el); return el; }
let raf=0;
function renderSeg(){ raf=0; if(st.seg) st.seg.innerHTML=md(st.segText); down(); }
function addText(t){ if(!st.seg){ closeThink(); st.seg=place(document.createElement('div')); st.seg.className='md typing'; st.segText=''; }
  st.segText+=t; if(!raf) raf=requestAnimationFrame(renderSeg); setLive('write','Пишу ответ'); st.orbState='speak'; }
function closeSeg(){ if(st.seg){ st.seg.classList.remove('typing'); st.seg.innerHTML=md(st.segText); } st.seg=null; }
function addThink(t){
  if(!st.think){ closeSeg(); st.think=place(document.createElement('div')); st.think.className='think'; st.thinkText=''; st.thinkT0=Date.now();
    st.think.innerHTML=`<div class="th"><span class="chev">${IC.chev}</span><span class="tl shine">Думает</span></div><div class="tb"></div>`;
    const el=st.think; el.querySelector('.th').onclick=()=>el.classList.toggle('open'); }
  st.thinkText+=t; const tb=st.think.querySelector('.tb'); tb.textContent=st.thinkText; tb.scrollTop=tb.scrollHeight; }
function closeThink(){ if(!st.think) return; const s=Math.max(1,Math.round((Date.now()-st.thinkT0)/1000));
  const tl=st.think.querySelector('.tl'); tl.classList.remove('shine'); tl.textContent=`Подумала · ${s} с`; st.think=null; }
const LIVE_ICON={think:'think',search:'search',read:'read',write:'write',exec:'exec',look:'look',draw:'draw',memory:'memory',plan:'plan'};
function setLive(kind,text){ if(!st.live) return; st.live.className='live show'; st.live.querySelector('.lic').innerHTML=IC[LIVE_ICON[kind]||'exec'];
  const s=st.live.querySelector('span'); s.textContent=text; s.className='shine'; }
function hideLive(){ if(st.live) st.live.classList.remove('show'); }
function toolEl(it,running){
  const el=document.createElement('div'); el.className='tool'+(running?' run':'');
  el.innerHTML=`<div class="head"><div class="ic">${IC[LIVE_ICON[it.kind]||'exec']}</div><span></span><div class="st">${running?'<div class="spin"></div>':''}</div><div class="chev">${IC.chev}</div></div><div class="body"></div>`;
  el.querySelector('.head span').textContent=it.label; el.querySelector('.body').textContent=it.detail||'…';
  el.querySelector('.head').onclick=()=>el.classList.toggle('open');
  if(!running) finishTool(el,it); return el;
}
function finishTool(el,it){
  el.classList.remove('run'); el.classList.toggle('fail',!it.ok);
  el.querySelector('.st').innerHTML=`<div style="width:16px;height:16px">${it.ok?IC.ok:IC.bad}</div>`;
  el.querySelector('.body').textContent=it.detail||'';
  if(it.image){ const im=document.createElement('img'); im.src=it.image; im.onclick=()=>{$('#zoomImg').src=it.image;$('#zoom').classList.add('show')}; el.appendChild(im); }

    else if(it.type==='assistant'){ closeSeg(); const s=place(document.createElement('div')); s.className='md'; s.innerHTML=md(it.text); }
    else if(it.type==='tool'){ closeSeg(); place(toolEl(it,false)); }

// ================= события от Мартышки =================
window.onEvents = evs => { for(const e of evs) onEvent(e); down(); };
function onEvent(e){
  switch(e.type){
    case 'status': $('#brainText').textContent=e.brain; $('#title').textContent=e.title; break;
    case 'assistant_start': turnEl(); st.orbState='think'; break;
    case 'activity': if(e.kind==='think'){ setLive('think','Думает'); st.orbState='think'; } else setLive(e.kind,e.text); break;
    case 'text': addText(e.text); break;
    case 'progress': addThink(e.text); setLive('think','Думает'); st.orbState='think'; break;
    case 'switch': addSwitch(e.text); break;
    case 'tool_start': { closeSeg(); closeThink(); const el=toolEl({label:e.label,detail:'выполняется…',kind:e.kind,name:e.name},true); el.id='t_'+e.id; place(el); st.orbState='think'; break; }
    case 'tool_end': { const el=document.getElementById('t_'+e.id); if(el) finishTool(el,e); break; }
    case 'plan': renderPlan(e.items); break;
    case 'confirm': openConfirm(e); break;
    case 'error': addError(e.text); break;
    case 'done': closeSeg(); closeThink(); hideLive(); setBusy(false); st.orbState='idle'; refreshChats(); refreshBalance(); break;
    case 'show_tab': openPanel(e.tab); break;
  }
}

function dayGroup(ts){ const d=new Date(ts*1000), n=new Date(); const diff=Math.floor((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);
  return diff<=0?'Сегодня':diff===1?'Вчера':diff<7?'На этой неделе':'Раньше'; }
function drawChats(){ const q=$('#chatSearch').value.trim().toLowerCase(); const box=$('#chats'); box.innerHTML=''; let g='';
  for(const c of st.chats){ if(q && !c.title.toLowerCase().includes(q)) continue; const gg=dayGroup(c.updated);
    if(gg!==g){ g=gg; const h=document.createElement('div'); h.className='grp'; h.textContent=g; box.appendChild(h); }
    const d=document.createElement('div'); d.className='chat'+(c.id===st.chatId?' on':'');
    d.innerHTML='<span></span><button class="del" title="Удалить чат">✕</button>'; d.querySelector('span').textContent=c.title;
    d.onclick=()=>openChat(c.id);
    d.querySelector('.del').onclick=async ev=>{ ev.stopPropagation(); if(!confirm('Удалить чат «'+c.title+'»? (он уйдёт в папку «удалённые»)')) return;
      await api().delete_chat(c.id); if(c.id===st.chatId){ st.chatId=null; $('#title').textContent='Новый чат'; emptyChat(); renderPlan([]); } refreshChats(); };
    box.appendChild(d); }
  if(!box.children.length) box.innerHTML='<div class="grp" style="text-transform:none">Пока пусто</div>'; }

function mark(k,v){ dirty[k]=v; }
function fieldEl(f){
  const d=document.createElement('div'); d.className='field'+(f.wide?' wide':'');
  d.innerHTML=`<div class="lab"><b>${esc(f.label)}</b>${f.desc?`<small>${f.desc}</small>`:''}</div><div class="ctl"></div>`;
  const c=d.querySelector('.ctl');
  if(f.type==='toggle'){ const t=document.createElement('div'); t.className='tog'+(f.value?' on':''); t.onclick=()=>{ t.classList.toggle('on'); mark(f.key,t.classList.contains('on')); }; c.appendChild(t); }
  else if(f.type==='select'){ const s=document.createElement('select'); s.className='in';
    s.innerHTML=f.options.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(f.value)?'selected':''}>${esc(n)}</option>`).join(''); s.onchange=()=>mark(f.key,s.value); c.appendChild(s); }
  else if(f.type==='slider'){ const r=document.createElement('input'); r.type='range'; r.min=f.min; r.max=f.max; r.step=f.step; r.value=f.value;

  else if(f.type==='textarea'){ d.classList.add('wide'); const t=document.createElement('textarea'); t.className='in'; t.value=f.value||''; t.oninput=()=>mark(f.key,t.value); c.appendChild(t); }

  else if(f.type==='connectors'){ d.classList.add('wide'); f.value.forEach(x=>{ const row=document.createElement('div'); row.className='field';

      row.querySelector('.tog').onclick=async ev=>{ ev.target.classList.toggle('on'); await api().toggle_connector(x.key,ev.target.classList.contains('on')); }; c.appendChild(row); }); c.style.flexDirection='column'; c.style.alignItems='stretch'; }
  else if(f.type==='info'){ c.innerHTML=`<span class="pill ${f.ok===true?'ok':f.ok===false?'bad':''}">${esc(f.value)}</span>`; }
  else if(f.type==='button'){ const b=document.createElement('button'); b.className='btn'+(f.danger?' red':''); b.textContent=f.text; b.onclick=async()=>{ b.disabled=true; const r=await api().settings_action(f.key); b.disabled=false; if(r&&r.message) toast(r.message); if(r&&r.reload) renderSettings(panel.tab); }; c.appendChild(b); }
  else { const i=document.createElement('input'); i.className='in'; i.type=f.type==='password'?'password':f.type==='number'?'number':'text'; i.value=f.value??''; i.placeholder=f.placeholder||'';
    if(f.type==='password') i.autocomplete='off'; i.oninput=()=>mark(f.key,f.type==='number'?parseFloat(i.value):i.value); c.appendChild(i); }
  return d;
}

async function voicePicker(c,f){
  c.style.flexDirection='column'; c.style.alignItems='stretch';
  const wrap=document.createElement('div'); wrap.innerHTML=`<div class="vfilter"></div><div style="display:flex;gap:8px;margin:0 0 10px"><input class="in" placeholder="Найти голос по названию…"><button class="btn">Искать во всей библиотеке</button></div><div class="vlist"><div style="color:var(--muted)">Загружаю голоса…</div></div>`;
  c.appendChild(wrap);
  let all=await api().voices(), flt='all', q='', cur=f.value||'';
  const F=[['all','Все'],['off','⭐ Официальные'],['ru','Русские'],['uk','Украинские'],['de','Немецкие'],['en','Английские'],['female','Женские'],['male','Мужские']];
  const fb=wrap.querySelector('.vfilter');
  F.forEach(([k,n])=>{ const b=document.createElement('button'); b.textContent=n; b.className=k===flt?'on':''; b.onclick=()=>{ flt=k; fb.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); draw(); }; fb.appendChild(b); });
  const inp=wrap.querySelector('input'); inp.oninput=()=>{ q=inp.value.trim().toLowerCase(); draw(); };
  wrap.querySelector('.btn').onclick=async()=>{ if(!q){ toast('Напиши название'); return; } toast('Ищу во всей библиотеке Fish…'); const r=await api().search_voices(q); const ids=new Set(all.map(v=>v.id)); r.forEach(v=>{ if(!ids.has(v.id)) all.push(v); }); draw(); };
  const L={ru:'RU',uk:'UK',de:'DE',en:'EN'};
  function draw(){ const list=wrap.querySelector('.vlist'); list.innerHTML='';
    const vs=all.filter(v=>(flt==='all'||(flt==='off'&&v.official)||v.lang===flt||v.gender===flt) && (!q||v.title.toLowerCase().includes(q)||(v.desc||'').toLowerCase().includes(q))).slice(0,300);
    if(!vs.length){ list.innerHTML='<div style="color:var(--muted)">Ничего не нашла.</div>'; return; }
    vs.forEach(v=>{ const r=document.createElement('div'); r.className='v'+(v.id===cur?' sel':'');
      r.innerHTML=`<button class="play" title="Послушать">${IC.play}</button><div class="vn"><b></b><small></small></div><span class="pill">${L[v.lang]||v.lang||'?'}</span>${v.official?'<span class="pill ok">официальный</span>':''}<button class="btn" style="height:30px">${v.id===cur?'Выбран ✓':'Выбрать'}</button>`;
      r.querySelector('b').textContent=v.title; r.querySelector('small').textContent=(v.gender==='female'?'женский · ':v.gender==='male'?'мужской · ':'')+(v.popular?Math.round(v.popular/1000)+'k использований · ':'')+(v.desc||'');
      r.querySelector('.play').onclick=async ev=>{ const p=ev.currentTarget; p.classList.add('busy'); const res=await api().preview_voice(v.id, v.lang); p.classList.remove('busy'); if(res&&res.error) toast(res.error); };
      r.querySelector('.btn').onclick=()=>{ cur=v.id; mark(f.key,v.id); if(f.instant){ api().save_settings({[f.key]:v.id}); toast('Голос: '+v.title); } draw(); };
      list.appendChild(r); }); }
  draw();
}

      c.innerHTML=`<h4><span></span><small style="font-weight:400"></small><div class="anger">${[1,2,3,4,5].map(i=>`<i class="${i<=p.anger?'f':''}"></i>`).join('')}</div></h4><ul class="facts"></ul>
        <div style="display:flex;gap:8px;margin-top:8px">${p.anger?'<button class="btn" data-calm>Успокоить</button>':''}</div>`;
      c.querySelector('h4 span').textContent=p.name; c.querySelector('h4 small').textContent=(p.last?' · был(а) '+p.last:'')+(p.count?' · реплик: '+p.count:'');
      const ul=c.querySelector('.facts'); if(!p.facts.length) ul.innerHTML='<li style="color:var(--dim)">фактов пока нет</li>';
      p.facts.forEach(f=>{ const li=document.createElement('li'); li.innerHTML='<span></span><button title="Забыть">✕</button>'; li.querySelector('span').textContent=f;
        li.querySelector('button').onclick=async()=>{ await api().forget_person_fact(p.name,f); renderMemory('people'); }; ul.appendChild(li); });
      const calm=c.querySelector('[data-calm]'); if(calm) calm.onclick=async()=>{ await api().calm_person(p.name); renderMemory('people'); };
      body.appendChild(c); });
  } else if(tab==='days'){
    if(!m.days.length) body.innerHTML='<div style="color:var(--muted)">Пересказы дней появятся завтра: каждый прошедший день Мартышка пересказывает себе сама.</div>';
    m.days.forEach(([d,t])=>{ const c=document.createElement('div'); c.className='card'; c.innerHTML='<h4></h4><div class="md"></div>'; c.querySelector('h4').textContent=d; c.querySelector('.md').innerHTML=md(t); body.appendChild(c); });
  } else {
    body.innerHTML='<p class="sub" style="color:var(--muted);margin:0 0 12px">Что Мартышка запомнила о тебе и твоём ПК. Лишнее — удали.</p>';
    const c=document.createElement('div'); c.className='card'; c.innerHTML='<ul class="facts"></ul>'; body.appendChild(c); const ul=c.querySelector('ul');
    if(!m.facts.length) ul.innerHTML='<li style="color:var(--dim)">Пока ничего. Скажи «запомни, что…».</li>';
    m.facts.forEach(([src,f])=>{ const li=document.createElement('li'); li.innerHTML='<span></span><button title="Забыть">✕</button>'; li.querySelector('span').textContent=f;
      li.querySelector('button').onclick=async()=>{ await api().forget_fact(src,f); renderMemory('facts'); }; ul.appendChild(li); });
  }
}

// ================= старт =================
async function poll(){ try{ setDots(await api().status_dots()); }catch(e){} }
window.addEventListener('pywebviewready', async()=>{
  const r=await api().init();
  orbColor=r.color||orbColor; orbs.forEach(o=>o.setColor(orbColor));
  document.querySelectorAll('#bmode button').forEach(b=>b.classList.toggle('on',b.dataset.m===r.brain_mode));
  updateHint(); $('#brainText').textContent=r.ready?'готова':'нужен ключ DeepSeek → Настройки';
  emptyChat(); refreshChats(); refreshBalance(); autosize(); setDots(r); setInterval(poll,5000);
  if(!r.ready) openPanel('settings','brain'); else if(r.tab && r.tab!=='chat') openPanel(r.tab);
  input.focus();
});
</script>
