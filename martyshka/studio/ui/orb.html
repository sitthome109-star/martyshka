<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Мартышка</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07080c;overflow:hidden;user-select:none}
.wrap{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.orb{width:100%;height:100%;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 28%,#d6efff 0%,#4fb3ff 22%,#3b6bff 48%,#6a3cff 72%,#1a0f3d 100%);
  box-shadow:0 0 22px rgba(79,179,255,.55),inset 0 -6px 14px rgba(20,8,60,.6);animation:breath 4s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(124,180,255,.0);transition:.3s}
.busy .orb{animation:breath 1.1s ease-in-out infinite, hue 3s linear infinite}
.busy .orb::after{border-color:rgba(124,180,255,.55);border-top-color:transparent;animation:spin 1s linear infinite}
.ask .orb{animation:askpulse .9s ease-in-out infinite;background:radial-gradient(circle at 34% 28%,#fff4d6 0%,#ffc14f 30%,#ff7a3b 65%,#3d1a0f 100%)}
@keyframes breath{50%{transform:scale(1.06);box-shadow:0 0 32px rgba(123,92,255,.7),inset 0 -6px 14px rgba(20,8,60,.6)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes askpulse{50%{transform:scale(1.1);box-shadow:0 0 34px rgba(255,170,60,.8)}}
.menu{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,12,18,.92);border-radius:50%;font:600 10px Segoe UI,sans-serif;color:#dfe6f5}
.menu.show{display:grid}.menu div{display:grid;gap:4px;text-align:center}.menu span{padding:3px 6px;border-radius:6px;cursor:pointer}
.menu span:hover{background:#26324a}
</style></head>
<body>
<div class="wrap" id="wrap" title="Мартышка — нажми, чтобы открыть. Правая кнопка — меню"><div class="orb"></div></div>
<div class="menu" id="menu"><div><span id="mOpen">Открыть</span><span id="mQuit">Закрыть</span></div></div>
<script>
const api=()=>window.pywebview.api;
function setState(s){ document.body.className = s==='idle' ? '' : s; }
let downAt=0, dx=0, dy=0;
document.getElementById('wrap').addEventListener('mousedown',e=>{downAt=Date.now();dx=e.screenX;dy=e.screenY});
document.getElementById('wrap').addEventListener('mouseup',e=>{
  if(e.button!==0) return;
  if(Date.now()-downAt<350 && Math.abs(e.screenX-dx)<4 && Math.abs(e.screenY-dy)<4) api().show_main(); });
document.addEventListener('contextmenu',e=>{e.preventDefault();document.getElementById('menu').classList.add('show')});
document.getElementById('menu').addEventListener('mouseleave',()=>document.getElementById('menu').classList.remove('show'));
document.getElementById('mOpen').onclick=()=>{document.getElementById('menu').classList.remove('show');api().show_main()};
document.getElementById('mQuit').onclick=()=>api().quit();
</script>
</body></html>
