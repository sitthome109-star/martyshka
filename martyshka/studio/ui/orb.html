<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Мартышка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07080c;overflow:hidden;user-select:none;font-family:Segoe UI,sans-serif}

.wrap{
  position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;
}

/* === Орб-контейнер === */
.orb-container{
  position:relative;width:min(320px,90vmin);height:min(320px,90vmin);
  display:flex;align-items:center;justify-content:center;
}

/* Основной шар с градиентом */
.orb{
  width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 38% 30%,rgba(255,255,255,0.9) 0%,transparent 4%),
    radial-gradient(circle at 32% 26%,#e8f4ff 0%,#4fb3ff 18%,#3b6bff 42%,#7c4cff 68%,#2a1560 90%,#120a30 100%);
  box-shadow:
    0 0 40px rgba(100,140,255,.4),
    0 0 80px rgba(100,140,255,.15),
    inset 0 -10px 30px rgba(10,5,40,.7),
    inset 0 10px 30px rgba(100,140,255,.1);
  animation:orbBreathe 5s ease-in-out infinite;
}

/* Внутреннее свечение-ореол */
.orb::before{
  content:'';position:absolute;inset:-8px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(120,160,255,.12) 0%,transparent 70%);
  animation:haloPulse 5s ease-in-out infinite;
}

/* Кольцо-ободка */
.orb::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;z-index:2;
  border:1.5px solid rgba(160,190,255,.0);
  transition:border-color .5s;
  animation:ringPulse 5s ease-in-out infinite;
}

/* === Внутренние слои / волны === */
.wave-layer{
  position:absolute;border-radius:50%;left:50%;top:50%;
  transform:translate(-50%,-50%);pointer-events:none;z-index:1;
  opacity:0;
}

.wave-1{
  width:60%;height:60%;
  background:radial-gradient(circle,rgba(120,160,255,.15) 0%,transparent 70%);
  animation:wavePulse 4s ease-in-out infinite;
}
.wave-2{
  width:80%;height:80%;
  background:radial-gradient(circle,rgba(100,130,255,.1) 0%,transparent 60%);
  animation:wavePulse 4s ease-in-out infinite .8s;
}
.wave-3{
  width:95%;height:95%;
  background:radial-gradient(circle,rgba(140,170,255,.06) 0%,transparent 50%);
  animation:wavePulse 4s ease-in-out infinite 1.6s;
}

/* === Блик на поверхности === */
.glare{
  position:absolute;width:35%;height:25%;top:12%;left:20%;
  border-radius:50%;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse,rgba(255,255,255,.35) 0%,transparent 70%);
  filter:blur(4px);
}

/* === Свечение при hover === */
.wrap:hover .orb{
  box-shadow:
    0 0 60px rgba(120,160,255,.5),
    0 0 120px rgba(120,160,255,.2),
    inset 0 -10px 30px rgba(10,5,40,.7),
    inset 0 10px 30px rgba(100,140,255,.15);
}
.wrap:hover .orb::after{border-color:rgba(160,190,255,.25)}

/* === Состояние busy (думаю) === */
.busy .orb{animation:orbBreathe 1.2s ease-in-out infinite;filter:hue-rotate(0deg);transition:filter .3s}
.busy .orb::before{background:radial-gradient(circle,rgba(160,120,255,.2) 0%,transparent 70%)}
.busy .orb::after{border-color:rgba(160,120,255,.4);animation:ringSpin 2s linear infinite}
.busy .wave-1{opacity:.3;animation:wavePulse 1.2s ease-in-out infinite}
.busy .wave-2{opacity:.25;animation:wavePulse 1.2s ease-in-out infinite .3s}
.busy .wave-3{opacity:.2;animation:wavePulse 1.2s ease-in-out infinite .6s}

/* === Состояние ask (ожидание) === */
.ask .orb{
  background:
    radial-gradient(circle at 38% 30%,rgba(255,255,240,.9) 0%,transparent 4%),
    radial-gradient(circle at 32% 26%,#fff8e1 0%,#ffd54f 22%,#ffb74d 48%,#ff8a65 72%,#6d3a1a 90%,#3a1f0a 100%);
  box-shadow:
    0 0 50px rgba(255,180,80,.4),
    0 0 100px rgba(255,180,80,.12),
    inset 0 -10px 30px rgba(40,15,0,.7),
    inset 0 10px 30px rgba(255,200,100,.1);
  animation:askPulse 1.5s ease-in-out infinite;
}
.ask .orb::before{background:radial-gradient(circle,rgba(255,200,100,.15) 0%,transparent 70%)}
.ask .orb::after{border-color:rgba(255,200,100,.3);animation:ringPulse 1.5s ease-in-out infinite}
.ask .wave-1{opacity:.3;animation:wavePulse 1.5s ease-in-out infinite;background:radial-gradient(circle,rgba(255,200,100,.15) 0%,transparent 70%)}
.ask .wave-2{opacity:.25;animation:wavePulse 1.5s ease-in-out infinite .3s;background:radial-gradient(circle,rgba(255,180,80,.1) 0%,transparent 60%)}
.ask .wave-3{opacity:.2;animation:wavePulse 1.5s ease-in-out infinite .6s;background:radial-gradient(circle,rgba(255,160,60,.06) 0%,transparent 50%)}

/* === Canvas для частиц === */
#particles{
  position:absolute;inset:0;border-radius:50%;z-index:4;pointer-events:none;
}

/* === Анимации === */
@keyframes orbBreathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}
@keyframes askPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 50px rgba(255,180,80,.4),0 0 100px rgba(255,180,80,.12),inset 0 -10px 30px rgba(40,15,0,.7)}
  50%{transform:scale(1.06);box-shadow:0 0 60px rgba(255,190,90,.5),0 0 110px rgba(255,180,80,.18),inset 0 -10px 30px rgba(40,15,0,.7)}
}
@keyframes haloPulse{
  0%,100%{transform:scale(1);opacity:.6}
  50%{transform:scale(1.15);opacity:1}
}
@keyframes ringPulse{
  0%,100%{transform:scale(1);border-color:rgba(160,190,255,.1)}
  50%{transform:scale(1.08);border-color:rgba(160,190,255,.3)}
}
@keyframes ringSpin{
  to{transform:rotate(360deg)}
}
@keyframes wavePulse{
  0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.4}
  50%{transform:translate(-50%,-50%) scale(1.3);opacity:.9}
}

/* === Меню (без изменений) === */
.menu{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,12,18,.92);border-radius:50%;font:600 10px Segoe UI,sans-serif;color:#dfe6f5}
.menu.show{display:grid}.menu div{display:grid;gap:4px;text-align:center}.menu span{padding:3px 6px;border-radius:6px;cursor:pointer}
.menu span:hover{background:#26324a}
</style></head>
<body>
<div class="wrap" id="wrap" title="Мартышка — нажми, чтобы открыть. Правая кнопка — меню">
  <div class="orb-container">
    <div class="orb" id="orb">
      <div class="wave-layer wave-1"></div>
      <div class="wave-layer wave-2"></div>
      <div class="wave-layer wave-3"></div>
      <div class="glare"></div>
    </div>
    <canvas id="particles"></canvas>
  </div>
</div>
<div class="menu" id="menu"><div><span id="mOpen">Открыть</span><span id="mQuit">Закрыть</span></div></div>

<script>
// === Canvas для частиц ===
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas(){
  const rect = canvas.parentElement.getBoundingClientRect();
  W = canvas.width = rect.width * devicePixelRatio;
  H = canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Частицы
const particles = [];
const MAX_PARTICLES = 50;

function createParticle(){
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.random() * W * 0.4;
  return {
    x: W/2 + Math.cos(angle) * radius,
    y: H/2 + Math.sin(angle) * radius,
    size: (Math.random() * 3 + 1) * devicePixelRatio,
    speed: Math.random() * 0.5 + 0.2,
    angle: angle,
    orbitRadius: radius,
    orbitSpeed: (Math.random() * 0.005 + 0.002) * (Math.random() > 0.5 ? 1 : -1),
    alpha: Math.random() * 0.6 + 0.3,
    life: 0,
    maxLife: Math.random() * 400 + 200,
    isSparkle: Math.random() > 0.7
  };
}

// Заполняем частицы
for(let i = 0; i < MAX_PARTICLES; i++){
  const p = createParticle();
  p.life = Math.random() * p.maxLife; // распределяем по фазам
  particles.push(p);
}

function getOrbColor(){
  const busy = document.body.classList.contains('busy');
  const ask = document.body.classList.contains('ask');
  if(ask) return {r:255, g:210, b:130};
  if(busy) return {r:180, g:140, b:255};
  return {r:160, g:200, b:255};
}

function drawParticles(){
  ctx.clearRect(0, 0, W, H);
  const color = getOrbColor();

  for(let p of particles){
    p.life++;
    if(p.life > p.maxLife){
      Object.assign(p, createParticle());
      p.life = 0;
    }

    // Плавное появление/исчезновение
    const fadeIn = Math.min(p.life / 50, 1);
    const fadeOut = Math.min((p.maxLife - p.life) / 50, 1);
    const alpha = p.alpha * fadeIn * fadeOut;

    // Орбитальное вращение
    p.angle += p.orbitSpeed;
    const cx = W/2 + Math.cos(p.angle) * p.orbitRadius;
    const cy = H/2 + Math.sin(p.angle) * p.orbitRadius;

    // Проверяем, что внутри круга
    const dist = Math.sqrt((cx - W/2)**2 + (cy - H/2)**2);
    if(dist > W * 0.46) continue;

    ctx.save();
    ctx.globalAlpha = alpha;

    if(p.isSparkle){
      // Искорка — крестик
      const s = p.size;
      ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},1)`;
      ctx.lineWidth = 1 * devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy);
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s);
      ctx.stroke();
    } else {
      // Мягкий кружок-звёздочка
      const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, p.size);
      gradient.addColorStop(0, `rgba(${color.r},${color.g},${color.b},0.9)`);
      gradient.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(cx, cy, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  requestAnimationFrame(drawParticles);
}
drawParticles();

// === Логика состояний и меню ===
const api = () => window.pywebview.api;

function setState(s){
  document.body.className = s === 'idle' ? '' : s;
}

let downAt = 0, dx = 0, dy = 0;
document.getElementById('wrap').addEventListener('mousedown', e => {
  downAt = Date.now();
  dx = e.screenX;
  dy = e.screenY;
});
document.getElementById('wrap').addEventListener('mouseup', e => {
  if(e.button !== 0) return;
  if(Date.now() - downAt < 350 && Math.abs(e.screenX - dx) < 4 && Math.abs(e.screenY - dy) < 4){
    api().show_main();
  }
});

document.addEventListener('contextmenu', e => {
  e.preventDefault();
  document.getElementById('menu').classList.add('show');
});
document.getElementById('menu').addEventListener('mouseleave', () => {
  document.getElementById('menu').classList.remove('show');
});
document.getElementById('mOpen').onclick = () => {
  document.getElementById('menu').classList.remove('show');
  api().show_main();
};
document.getElementById('mQuit').onclick = () => api().quit();
</script>
</body></html>
